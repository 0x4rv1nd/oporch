[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oporch"
version = "2.0.0"
description = "Multi-agent orchestration system for OpenCode"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Arvind G.", email = "arvind301024@gmail.com" }]
keywords = ["ai", "agents", "orchestration", "opencode", "llm", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "textual>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage    = "https://github.com/0x4rv1nd/oporch"
Repository  = "https://github.com/0x4rv1nd/oporch"
Issues      = "https://github.com/0x4rv1nd/oporch/issues"

[project.scripts]
oporch = "oporch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src"]
